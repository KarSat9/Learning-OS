      await refresh(); // study plan may have changed (gap priority)
    } catch(e) {
      push('Diagnosis failed: ' + e.message, 'error');
    } finally {
      setDiagLoading(false);
    }
  }

  useEffect(() => {
    refresh().then(() => runDiagnosis());
  }, []);

  async function onMastery(conceptId, level) {
    try {
      await api(`/progress/${conceptId}`, {
        method: 'PUT',
        body: JSON.stringify({ mastery_level: level }),
      });
      push(`Mastery updated → ${MASTERY_LABELS[level]}`, 'success');
      refresh();
    } catch(e) {
      push(e.message, 'error');
    }
  }

  async function onDelete(id, name) {
    if (!confirm(`Delete "${name}"? This will remove all prerequisite links.`)) return;
    try {
      await api(`/concepts/${id}`, { method: 'DELETE' });
      push(`Deleted "${name}"`, 'info');
      refresh();
    } catch(e) {
      push(e.message, 'error');
    }
  }

  async function onRemovePrereq(conceptId, prereqId) {
    try {
      await api(`/prerequisites/${conceptId}/${prereqId}`, { method: 'DELETE' });
      push('Prerequisite removed', 'info');
      refresh();
    } catch(e) {
      push(e.message, 'error');
    }
  }

  async function seedData() {
    try {
      await api('/seed', { method: 'POST' });
      push('ML curriculum loaded!', 'success');
      refresh();
    } catch(e) {
      push(e.message, 'error');
    }
  }

  function handleAddPrereq(concept) {
    setAddPrereqFor(concept);
    setLinkModal(true);
  }

  function handleViewInGraph(conceptId) {
    setTab('graph');
    // GraphView reads this via a shared ref
    window.__jumpToNode = conceptId;
  }

  const gapCount = diagnosis?.gaps?.length ?? 0;

  const nav = [
    { id: 'dashboard', label: 'Dashboard',  icon: icons.dashboard },
    { id: 'concepts',  label: 'Concepts',   icon: icons.list },
    { id: 'graph',     label: 'Graph',       icon: icons.graph },
    { id: 'diagnose',  label: 'Diagnose',    icon: (
        <svg className="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5">
          <circle cx="8" cy="8" r="6"/>
          <line x1="8" y1="5" x2="8" y2="8"/><circle cx="8" cy="11" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      ), badge: gapCount > 0 ? gapCount : null
    },
  ];

  return (
    <div className="app-shell">
      {/* Header */}
      <header className="header">
        <div className="logo">Learning<span> OS</span></div>
        <div className="header-stats">
          <div className="hstat">
            <span className="hstat-val" style={{color:'var(--green)'}}>{stats.completion_pct ?? 0}%</span>
            <span className="hstat-lbl">Complete</span>
          </div>
          <div className="hstat">
            <span className="hstat-val">{stats.mastered ?? 0}/{stats.total_concepts ?? 0}</span>
            <span className="hstat-lbl">Mastered</span>
          </div>
          <div className="hstat">
            <span className="hstat-val" style={{color:'var(--amber)'}}>{stats.available_to_study ?? 0}</span>
            <span className="hstat-lbl">Available</span>
          </div>
        </div>
      </header>

      {/* Sidebar */}
      <nav className="sidebar">
        <div className="nav-section">
          <div className="nav-label">Navigation</div>
          {nav.map(n => (
            <div key={n.id}
              className={`nav-item ${tab === n.id ? 'active' : ''}`}
              onClick={() => setTab(n.id)}
              style={{position:'relative'}}>
              {n.icon} {n.label}
              {n.badge && (
                <span style={{
                  marginLeft:'auto',
                  background:'var(--red)',
                  color:'#fff',
                  borderRadius:'10px',
                  fontSize:'0.65rem',
                  fontWeight:700,
                  padding:'1px 6px',
                  lineHeight:'1.6',
                }}>
                  {n.badge}
                </span>
              )}
            </div>
          ))}
        </div>

        <div className="nav-section" style={{marginTop:16}}>
          <div className="nav-label">Actions</div>
          <div className="nav-item" onClick={() => setAddModal(true)}>
            {icons.plus} Add Concept
          </div>
          <div className="nav-item" onClick={() => setLinkModal(true)}>
            <svg className="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5">
              <circle cx="3" cy="8" r="2"/><circle cx="13" cy="8" r="2"/>
              <line x1="5" y1="8" x2="11" y2="8"/>
            </svg>
            Link Prerequisite
          </div>
          <div className="nav-item" onClick={seedData} style={{borderTop:'1px solid var(--border)',marginTop:8,paddingTop:12}}>
            <svg className="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5">
              <circle cx="8" cy="8" r="6"/>
              <path d="M8 5v3l2 2"/>
            </svg>
            Load ML Example
          </div>
        </div>

        {/* Mini mastery legend */}
        <div style={{padding:'20px',marginTop:'auto'}}>
          <div className="nav-label" style={{marginBottom:8}}>Mastery Levels</div>
          {MASTERY_LABELS.map((l,i) => (
            <div key={i} style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
              <span className={`mastery ${MASTERY_CLS[i]}`} style={{fontSize:'0.65rem'}}>{i}</span>
              <span style={{fontSize:'0.72rem',color:'var(--text3)'}}>{l}</span>
            </div>
          ))}
        </div>
      </nav>

      {/* Main content */}
      <main className="main">
        {tab === 'dashboard' && (
          <>
            <div className="page-title">Dashboard</div>
            <div className="page-sub">Your learning progress at a glance</div>
            <Dashboard
              concepts={concepts}
              studyPlan={studyPlan}
              stats={stats}
              onMastery={onMastery}
              loading={loading}
            />
          </>
        )}

        {tab === 'concepts' && (
          <>
            <div className="page-title">Concepts</div>
            <div className="page-sub">{concepts.length} concept{concepts.length !== 1 ? 's' : ''} in your graph</div>
            <ConceptsList
              concepts={concepts}
              onMastery={onMastery}
              onDelete={onDelete}
              onAddPrereq={handleAddPrereq}
              onRemovePrereq={onRemovePrereq}
              onAdd={refresh}
              push={push}
            />
          </>
        )}

        {tab === 'graph' && (
          <>
            <div className="page-title">Concept Graph</div>
            <div className="page-sub">Dependency map — prerequisites flow left to right</div>
            <GraphView concepts={concepts} onMastery={onMastery} diagnosis={diagnosis} />
          </>
        )}

        {tab === 'diagnose' && (
          <>
            <div className="page-title">Knowledge Gap Diagnosis</div>
            <div className="page-sub">
              Identifies the root prerequisite causing your difficulty — scored from quiz answers
            </div>
            <GapDiagnosisView
              concepts={concepts}
              diagnosis={diagnosis}
              loading={diagLoading}
              onRefresh={runDiagnosis}
              onViewGraph={handleViewInGraph}
              push={push}
            />
          </>
        )}
      </main>

      {/* Modals */}
      {addModal && (
        <AddConceptModal
          onClose={() => setAddModal(false)}
          onAdd={refresh}
          push={push}
        />
      )}
      {linkModal && (
        <LinkPrereqModal
          concepts={concepts}
          onClose={() => { setLinkModal(false); setAddPrereqFor(null); }}
          onLink={refresh}
          push={push}
        />
      )}

      <Toasts toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
